# Genera la animación de la serpiente a partir del calendario de contribuciones
# y la publica en la rama "output", desde donde la lee el README.
# Repo público: GitHub Actions no cobra minutos. Tarda menos de 1 minuto al día.
name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 5 * * *" # una vez al día (05:00 UTC)
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1B7F4B&color_dots=#ebedf0,#b7ebc8,#6fd49a,#3DDC84,#1B7F4B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3DDC84&color_dots=#161b22,#0e4429,#006d32,#26a641,#3DDC84

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: actualizar serpiente de contribuciones"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
